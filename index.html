<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1b4332" />
    <meta name="description" content="Controlador móvil PWA para Gorilla Escape: Gorilimpiadas" />
    
    <!-- PWA & Apple Touch Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/gorilla-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/gorilla-icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Gorilla Escape - Mobile Controller</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Registro del Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Service Worker registrado con éxito:', registration.scope);
            })
            .catch((error) => {
              console.error('Fallo en el registro del Service Worker:', error);
            });
        });
      }
    </script>
  </body>
</html>
