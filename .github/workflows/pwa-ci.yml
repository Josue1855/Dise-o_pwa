name: PWA validation and deliverables
on:
  pull_request:
  push:
    branches: [develop, main]
    tags: ['pwa-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run available PWA smoke tests
        run: node --test --test-reporter=tap tests/*.test.mjs
      - name: Build
        run: npm run build
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Create versioned developer package
        shell: bash
        run: |
          printf 'Gorilla Escape PWA static build\nCommit: %s\nRef: %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > BUILD_INFO.txt
          tar -czf pwa-static-build.tar.gz dist BUILD_INFO.txt
      - name: Preserve static build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pwa-static-build
          path: pwa-static-build.tar.gz
          retention-days: 30
      - name: Record run evidence
        if: always()
        shell: bash
        run: |
          echo "### PWA validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checks: manifest smoke, Vite build, production npm audit." >> "$GITHUB_STEP_SUMMARY"
          echo "- Browser/mobile/end-to-end checks: not covered by this workflow." >> "$GITHUB_STEP_SUMMARY"
  release:
    if: startsWith(github.ref, 'refs/tags/pwa-v')
    needs: pwa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pwa-static-build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pwa-static-build.tar.gz --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
